          .ef{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ef .sc{flex:1;min-width:110px;font-size:11.5px;font-weight:700;color:var(--mut)}.spk{color:var(--acc);flex:none}
          .mi{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:7px 0;box-shadow:0 1px 2px rgba(16,40,90,.05)}
          .mi.un{border-left:5px solid var(--acc);background:linear-gradient(90deg,rgba(10,108,255,.07),var(--card))}
          .mav{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#0A6CFF,#6B3CF2);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}.mav img{width:100%;height:100%;object-fit:cover}
          .mbd{flex:1;min-width:0}.mbd b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mbd span{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .mi.un .mbd span{color:var(--ink);font-weight:700}.mtm{text-align:right;flex:none}.dot{display:block;width:11px;height:11px;border-radius:50%;background:var(--acc);margin:6px 0 0 auto}
          .mchat{max-height:48vh;overflow:auto;padding:6px 2px;display:flex;flex-direction:column;gap:6px}
          .bub{display:flex}.bub span{max-width:82%;padding:8px 12px;border-radius:18px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
          .bub.th span{background:var(--chip);border-bottom-left-radius:6px}.bub.me{justify-content:flex-end}.bub.me span{background:linear-gradient(135deg,#0A6CFF,#3358FF);color:#fff;border-bottom-right-radius:6px}
          .msys{text-align:center;color:var(--mut);font-size:11.5px;padding:4px}
          .mbar{position:sticky;bottom:-14px;background:var(--card);padding:8px 0 2px;margin-top:8px;border-top:1px solid var(--line)}.mbar textarea{min-height:48px;margin:0}.mqk{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.qk{white-space:nowrap;flex:none}
          nav button{font-size:10px}nav button b{font-size:10px}

          /* ===== v4: lịch sử gọn + bảng so sánh + nội dung tương tác ===== */
          .cmk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.cmk>div{background:var(--chip);border-radius:12px;padding:8px 6px;text-align:center}.cmk i{display:block;font-style:normal;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}.cmk b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
          .cmn{display:block;margin:6px 2px 8px;color:var(--mut)}.cmpw{overflow-x:auto;-webkit-overflow-scrolling:touch}
          .cmp{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:420px}.cmp th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);text-align:right;padding:6px 6px;border-bottom:1.5px solid var(--line)}.cmp th:first-child,.cmp td:first-child{text-align:left}
          .cmp td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}.cmp tr.cur td{background:rgba(10,108,255,.07);font-weight:700}.cmp td.g{color:#16A34A}.cmp td.o{color:#D97706}.cmp td.r{color:#DC2626}
          .cmp u.up,.cmk u.up{color:#16A34A}.cmp u.dn,.cmk u.dn{color:#DC2626}.cmp u.dz,.cmk u.dz{color:var(--mut)}.cmp u,.cmk u{text-decoration:none;font-size:11px;font-weight:700}
          .hday{display:flex;justify-content:space-between;align-items:center;margin:12px 4px 6px;font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}.hday em{font-style:normal;font-weight:700;display:flex;gap:6px;align-items:center}
          .dk{display:inline-block;width:8px;height:8px;border-radius:50%}.dk.ok{background:#16A34A}.dk.pe{background:#D97706}.dk.er{background:#DC2626}
          .hr{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px;margin-bottom:6px;cursor:pointer}
          .hr .hd2{width:9px;height:9px;border-radius:50%;background:#94A3B8}.hr.ok .hd2{background:#16A34A}.hr.pe .hd2{background:#D97706}.hr.er .hd2{background:#DC2626}.hr.er{border-color:rgba(220,38,38,.35)}
          .hm{min-width:0}.hm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hm small{display:block;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .hb{display:flex;align-items:center;gap:6px}.hib{width:32px;height:32px;padding:0;border-radius:10px;background:var(--chip);color:var(--acc);font-size:15px}
          .hst{font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;letter-spacing:.3px;white-space:nowrap;background:var(--chip);color:var(--mut)}.hst.ok{background:rgba(22,163,74,.14);color:#15803D}.hst.pe{background:rgba(217,119,6,.14);color:#B45309}.hst.er{background:rgba(220,38,38,.12);color:#B91C1C}
          .hx2{display:none;grid-column:1/-1;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}.hr.x .hx2{display:block}.hdt{font-size:12.5px;color:var(--mut);margin-bottom:6px;word-break:break-word}
          .ew{margin:8px 0 2px;font-size:12px;font-weight:700;color:#B91C1C;background:rgba(220,38,38,.1);padding:6px 10px;border-radius:10px}.ev{margin:8px 0 2px;font-size:12px;font-weight:700;color:#15803D}
          .ept{margin:4px 0;font-size:12.5px;color:var(--mut);font-style:italic}.erx{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.erx span{font-size:11.5px;background:var(--chip);padding:3px 9px;border-radius:99px}
          .ecm{margin:6px 0}.ecm summary{font-weight:700;font-size:13px;cursor:pointer}.cmi{padding:7px 0;border-bottom:1px solid var(--line)}.cmi b{display:block;font-size:12.5px}.cmi span{font-size:13px}

          .qp{height:6px;border-radius:4px;background:var(--line);margin:6px 0 2px;overflow:hidden}.qp i{display:block;height:100%;background:linear-gradient(90deg,#1B74E4,#7C3AED);transition:width .35s}
          .qs{font-size:11.5px;font-weight:700;color:var(--acc)}.qs.pz{color:#B45309}
          #qCtl{display:none;gap:6px}body.busy #qCtl{display:flex}
          .chip.rm{background:#FEE2E2;color:#B91C1C;font-weight:800}.chip.rw{background:#FEF3C7;color:#92400E}
          .adm{font-size:12px;line-height:1.5;margin-top:3px;color:var(--mut,#64748B)}
          details>summary{cursor:pointer;padding:6px 0}details[open]>summary{margin-bottom:4px}#pg-about details{border-top:1px solid var(--line);padding:4px 0}#pg-about small{display:block;line-height:1.65}
          </style></head><body>
          <header><div class="logo">FACEBOOK AUTUPRO<small>LÊ HIẾU • 093579.1000</small></div><div class="sp"></div><button class="acc" id="chip" onclick="P('acc')">○ FB chưa kiểm tra</button></header>
