          <textarea id="cTx" placeholder="Nội dung bài / caption. Spintax {Xin chào|Chào cả nhà}. Nhiều mẫu: ngăn bằng dòng ---" style="min-height:90px"></textarea></div>
          <div class="card slim"><div class="row"><button class="g" onclick="A.campPick()">Chọn nhóm…</button><b class="fx" id="cCnt" style="color:var(--acc)">0 nhóm</b></div>
