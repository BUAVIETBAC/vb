          <nav id="nav"></nav><div id="sheet" onclick="if(event.target.id=='sheet')A.close()"><div id="shB"></div></div><div id="toast"></div>
          <script>
          const $=s=>document.querySelector(s),W=ms=>new Promise(r=>setTimeout(r,ms)),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const Br=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.AutuBrowser;
          const BUILD='__BUILD__',KEY='autu_state_v3';
          const M={threads:[],open:null,msgs:[],auto:false,timer:null,busy:false,ready:false,unread:0,inited:false,t:'',needPin:false,loading:false};
          const QUICK=['Dạ em chào anh/chị ạ, em hỗ trợ mình ngay ạ.','Anh/chị cho em xin số điện thoại/Zalo để tư vấn nhanh nhé ạ.','Dạ em gửi thông tin và báo giá cho mình ngay ạ.','Cảm ơn anh/chị đã quan tâm ạ!'];
          let S={groups:[],trash:[],hist:[],eng:{},camps:[],ledger:[],set:{skipOk:true,bg:true,showFb:false,theme:'auto',j1:15,j2:30,f:'Tất cả',s:'Thành viên ↓'},acc:null,log:[],camp:null};
          let SEL=new Set(),TSEL=new Set(),FR=[],FSEL=new Set(),CSEL=new Set(),QUEUE=[],lastRes='',shownN=80;
          const T={busy:false,stop:false,pause:false,held:false,canPause:false,frac:0,name:'',done:0,total:0,t0:0,msg:'',fb:false};
          const now=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())};
          let svT=null;function sv(){clearTimeout(svT);svT=setTimeout(async()=>{const v=JSON.stringify(S);try{if(Br())await Br().save({key:KEY,value:v});else localStorage.setItem(KEY,v)}catch(e){try{localStorage.setItem(KEY,v)}catch(_){}}},1500)}
          function L(m){S.log.push(now().slice(11)+' '+m);S.log=S.log.slice(-200);if($('#pg-acc').classList.contains('on'))$('#lg').textContent=S.log.slice(-70).join('\n');sv()}
          function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
          /* ---------- parsing (port từ bản PC) ---------- */
          const nfd=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');
          function m2i(t){if(!t)return 0;let r=nfd(t).toUpperCase().replace(/\s/g,''),m=1;if(r.includes('TRIEU')||/M$/.test(r)){m=1e6;r=r.replace('TRIEU','').replace(/M$/,'')}else if(r.includes('NGHIN')||/K$/.test(r)){m=1e3;r=r.replace('NGHIN','').replace(/K$/,'')}else if(/B$/.test(r)){m=1e9;r=r.replace(/B$/,'')}
           if(m>1){r=r.replace(/,/g,'.').replace(/[^0-9.]/g,'');return Math.floor(parseFloat(r)*m)||0}return parseInt(r.replace(/\D/g,''))||0}
          function fmtM(b){if(!b)return'Không thấy';for(const p of[/([\d][\d\s.,]*\s*(?:K|M|B)?)\s+(?:members|member)\b/i,/([\d][\d\s.,]*\s*(?:K|M|B)?)\s+thành\s+viên/i,/([\d][\d\s.,]*\s*(?:nghìn|triệu)?)\s+thành\s+viên/i,/([\d][\d\s.,]*\s*(?:rb|jt)?)\s+anggota\b/i]){const m=b.match(p);if(m)return m[1].replace(/\s+/g,' ').trim()}return'Không thấy'}
          const BAD=new Set(['facebook','nhóm','groups','thông báo','notifications','trang chủ','home','menu','tìm kiếm','search','bảng feed của bạn','your feed','nhóm của bạn','your groups','khám phá','discover','mời','invite','hoạt động','activity']);
          function vname(v){v=String(v||'').replace(/\s+/g,' ').trim().replace(/\s*\|\s*Facebook\s*$/i,'').trim();if(v.length<2)return'';if(BAD.has(v.toLowerCase()))return'';if(/^(?:thông báo|notifications?)(?:\s*\(.*\))?$/i.test(v))return'';if(/^(?:nhóm|groups?)(?:\s*\(.*\))?$/i.test(v))return'';return v.slice(0,180)}
          const RESV=/^(feed|discover|create|notifications|search|joins|for_you|your_groups)$/i;
          function canon(h){const m=String(h||'').match(/facebook\.com\/groups\/([^/?#]+)/i);if(!m||RESV.test(m[1]))return'';return'https://www.facebook.com/groups/'+m[1]+'/'}
          function gk(u){const m=String(u||'').match(/facebook\.com\/groups\/([^/?#]+)/i);return m?m[1].toLowerCase():String(u||'').toLowerCase().replace(/\/+$/,'')}
          function cleanUrl(v){let s=String(v||'').trim();if(!s)return'';if(/^\d+$/.test(s))return'https://www.facebook.com/groups/'+s+'/';if(!/facebook\.com\/groups\//i.test(s))return'';if(!/^http/i.test(s))s='https://'+s.replace(/^\/+/,'');return canon(s)||s}
          const mnum=g=>{const p=m2i(g.members||'');return p>0?p:(g.members_num|0)};
          const okRec=g=>{const st=String(g.scan_status||'').toUpperCase(),n=String(g.name||'').trim().toUpperCase();return['OK','ĐỒNG BỘ OK'].includes(st)&&!['','KHÔNG ĐỌC ĐƯỢC','KHÔNG XÁC ĐỊNH','CHƯA QUÉT','THÔNG BÁO'].includes(n)&&mnum(g)>0};
          const strongEv=g=>/^(nút Đã tham gia|danh sách nhóm của bạn)$/.test(g.join_evidence||'');
           const stable=g=>okRec(g)&&strongEv(g)&&String(g.membership_status||'').toUpperCase()=='ĐÃ THAM GIA'&&!!g.membership_verified&&g.sync_verified!==false;
          function spin(t){let o=t;for(let i=0;i<100;i++){const m=o.match(/\{([^{}]+)\}/);if(!m)break;const c=m[1].split('|').map(x=>x.trim()).filter(Boolean);o=o.slice(0,m.index)+(c.length?c[Math.floor(Math.random()*c.length)]:m[0])+o.slice(m.index+m[0].length)}return o}
          function pickContent(raw){const b=String(raw||'').split(/\n\s*---+\s*\n/).map(x=>x.trim()).filter(Boolean);return b.length?spin(b[Math.floor(Math.random()*b.length)]):''}
          /* ---------- chạy trong trang Facebook (stringify, không phụ thuộc biến ngoài) ---------- */
          function helperFactory(){const A={st:(m,p)=>{try{window.__AST=JSON.stringify({m:m,p:p})}catch(_){}},sl:ms=>new Promise(r=>setTimeout(r,ms)),vis:e=>!!(e.offsetWidth||e.offsetHeight||e.getClientRects().length),
           find(rx,sel,top,root){const out=[];for(const e of (root||document).querySelectorAll(sel||'[role=button],button,a[role=button],[role=menuitem],[role=option],[role=tab]')){if(!A.vis(e))continue;let hit=false;for(const x of[e.getAttribute('aria-label'),e.innerText]){const t=((x||'')+'').trim();if(t&&t.length<=90&&rx.test(t)){hit=true;break}}if(!hit)continue;if(top&&e.getBoundingClientRect().top>top)continue;out.push(e)}return A.best(out)},
          strong(e){return /^(button|menuitem|option|tab|radio|checkbox|link)$/.test((e.getAttribute('role')||'').toLowerCase())||e.tagName==='BUTTON'||e.tagName==='A'},
          best(l){if(!l.length)return null;const s=l.filter(A.strong);if(s.length)return s[0];return l.slice().sort((a,b)=>{const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();return ra.width*ra.height-rb.width*rb.height})[0]},
          async press(e){e.scrollIntoView({block:'center'});await A.sl(350);const r=e.getBoundingClientRect(),x=Math.round(r.left+Math.min(r.width/2,180)),y=Math.round(r.top+r.height/2);let t=document.elementFromPoint(x,y);if(!t||!(e.contains(t)||t.contains(e)))t=e;const o={bubbles:true,cancelable:true,composed:true,view:window,clientX:x,clientY:y,button:0};const P=(n,x2)=>{try{t.dispatchEvent(new PointerEvent(n,Object.assign({pointerId:1,pointerType:'mouse',isPrimary:true},o,x2)))}catch(_){}};P('pointerover');P('pointerdown',{buttons:1});t.dispatchEvent(new MouseEvent('mousedown',Object.assign({buttons:1},o)));P('pointerup');t.dispatchEvent(new MouseEvent('mouseup',o));t.dispatchEvent(new MouseEvent('click',o));return true},
          async click(rx,ms,sel,top,root){const end=Date.now()+(ms||6000);while(Date.now()<end){const e=A.find(rx,sel,top,root);if(e){await A.press(e);return true}await A.sl(400)}return false},
           async type(el,t){el.focus();await A.sl(300);document.execCommand('selectAll');document.execCommand('insertText',false,t);el.dispatchEvent(new Event('input',{bubbles:true}))},
           postLinks(){const s=new Set();document.querySelectorAll('a[href*="/posts/"],a[href*="/permalink/"]').forEach(a=>{const m=a.href.match(/(https:\/\/www\.facebook\.com\/groups\/[^/?#]+\/(?:posts|permalink)\/\d+)/);if(m)s.add(m[1])});return s},
           norm(t){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').replace(/\s+/g,' ').trim().toLowerCase()},
           isSub(l){l=String(l||'').replace(/\s+/g,' ').trim();if(!l||l.length>40)return false;if(/(ẩn danh|anonymous|đối tượng|audience|lên tin|story|messenger|sao chép|copy|chỉnh sửa|edit)/i.test(l))return false;return /^(đăng|post|đăng bài|publish|chia sẻ|share|chia sẻ lên nhóm|share to group|đăng lên nhóm)$/i.test(l)},
           dlg(){let best=null,bs=0;for(const d of document.querySelectorAll('[role=dialog]')){if(!A.vis(d))continue;let sc=0;const t=(d.innerText||'').slice(0,2600);if(/Tạo bài viết|Create post|Đăng bài|Create a post|Create a public post/i.test(t))sc+=12;if(A.editor(d))sc+=10;for(const b of d.querySelectorAll('[role=button],button')){if(!A.vis(b))continue;if(A.isSub(b.getAttribute('aria-label'))||A.isSub(b.innerText)){sc+=8;break}}if(sc>=10&&sc>=bs){best=d;bs=sc}}return best},
           editor(dg){const root=dg||document;let best=null,bs=-1;for(const e of root.querySelectorAll('[contenteditable=true]')){if(!A.vis(e))continue;const r=e.getBoundingClientRect();if(r.width<160||r.height<24)continue;const at=((e.getAttribute('aria-label')||'')+' '+(e.getAttribute('aria-placeholder')||'')+' '+(e.getAttribute('data-placeholder')||'')).toLowerCase();if(/(tìm kiếm|search facebook|viết bình luận|write a comment|comment as|nhắn tin|message)/.test(at))continue;let sc=0;if(e.getAttribute('role')==='textbox')sc+=5;if(/(bạn đang nghĩ gì|bạn viết gì|viết gì đó|tạo bài viết|what.s on your mind|write something|create post)/.test(at))sc+=40;if(r.width>=360)sc+=8;if(r.height>=40)sc+=4;if(sc>bs){best=e;bs=sc}}return best},
           async fill(ed,text){const want=String(text||'');const probe=A.norm(want).slice(0,24);const has=()=>A.norm(ed.innerText||ed.textContent||'').includes(probe);
            for(let m=0;m<3;m++){try{ed.focus();await A.sl(300);if(m>0){document.execCommand('selectAll');document.execCommand('delete')}
             if(m==0){document.execCommand('selectAll');want.split('\n').forEach((l,i)=>{if(i)document.execCommand('insertParagraph');if(l)document.execCommand('insertText',false,l)})}
             else if(m==1){const dt=new DataTransfer();dt.setData('text/plain',want);ed.dispatchEvent(new ClipboardEvent('paste',{clipboardData:dt,bubbles:true,cancelable:true}))}
             else{ed.dispatchEvent(new InputEvent('beforeinput',{inputType:'insertText',data:want,bubbles:true,cancelable:true}));if(!has())ed.textContent=want;ed.dispatchEvent(new InputEvent('input',{inputType:'insertText',data:want,bubbles:true}))}
            }catch(_){}await A.sl(900);if(has())return true}return false},
           async submit(dg,ms){const end=Date.now()+(ms||24000);const seen=[];let nudged=false;const t0=Date.now();
            while(Date.now()<end){dg=A.dlg()||dg;for(const b of[...dg.querySelectorAll('[role=button],button')].reverse()){if(!A.vis(b))continue;let lab='';for(const x of[b.getAttribute('aria-label'),b.getAttribute('title'),b.innerText]){if(A.isSub(x)){lab=String(x).trim();break}}if(!lab)continue;
              if(b.getAttribute('aria-disabled')==='true'||b.hasAttribute('disabled')){seen.push(lab+':TẮT');continue}await A.press(b);return{ok:true,d:lab}}
             if(!nudged&&Date.now()-t0>7000&&seen.length){nudged=true;const ed=A.editor(dg);if(ed){ed.focus();ed.dispatchEvent(new InputEvent('input',{bubbles:true}))}}await A.sl(500)}
            return{ok:false,d:'nút Đăng: '+([...new Set(seen)].slice(-3).join(',')||'không thấy')}},
           has(ed,u){return A.norm(ed.innerText||ed.textContent||'').includes(A.norm(u).slice(0,20))},
          async delUrl(ed,url,mode){ed.focus();await A.sl(250);const s=window.getSelection();
          if(mode==0){try{s.selectAllChildren(ed);s.collapseToEnd()}catch(_){}for(let i=0;i<url.length;i++)document.execCommand('delete')}
          else{const w=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);let n,r=null;while(n=w.nextNode()){const k=n.textContent.indexOf(url);if(k>=0){r=document.createRange();r.setStart(n,k);r.setEnd(n,k+url.length);break}}if(!r)return false;s.removeAllRanges();s.addRange(r);if(mode==1)document.execCommand('delete');else document.execCommand('insertText',false,' ')}
