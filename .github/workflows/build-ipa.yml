           sync:()=>syncGroups(),scan:m=>scanGroups(m),find:()=>findGroups(),fJoin:()=>joinSelected(),fSel(){FR.forEach(g=>FSEL.add(gk(g.url)));R.find()},
           stop(){if(!T.busy)return;T.stop=true;L('Đã yêu cầu dừng');toast('Đang dừng...')},
           async toggleFb(){if(!T.busy)return toast('Chỉ dùng khi có tác vụ đang chạy');T.fb=!T.fb;await Br().setVisible({visible:T.fb});tick()},
           addGroup(){const v=prompt('Nhập URL hoặc ID group:');if(!v)return;const url=cleanUrl(v);if(!url)return toast('Link không hợp lệ');const k=gk(url);if(S.groups.some(g=>gk(g.url)==k))return alert('Group này đã tồn tại trong danh sách.');
            if(blockedKeys().has(k)){if(confirm('Group này đang nằm trong tab “Đã xóa”.\n\nKhôi phục lại vào danh sách?')){SEL.clear();TSEL=new Set([k]);A.restore(0)}return}
            S.groups.push({url,name:'',members:'',scan_status:'Chưa quét',scanned_at:'',enabled:true});sv();R.groups()},
           importTxt(){const f=$('#fileTxt');f.value='';f.onchange=async()=>{const file=f.files[0];if(!file)return;const txt=await file.text();let add=0,blk=0;const ex=new Set(S.groups.map(g=>gk(g.url))),bl=blockedKeys();
             txt.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l||l[0]=='#')return;const u=cleanUrl(l),k=gk(u);if(!u)return;if(bl.has(k)){blk++;return}if(!ex.has(k)){S.groups.push({url:u,name:'',members:'',scan_status:'Chưa quét',scanned_at:'',enabled:true});ex.add(k);add++}});sv();R.groups();alert('Đã thêm '+add+' group mới.'+(blk?'\nBỏ qua '+blk+' group trong tab “Đã xóa”.':''))};f.click()},
           trash(keys,reason){const set=new Set(keys),bl=blockedKeys();let n=0;S.groups=S.groups.filter(g=>{const k=gk(g.url);if(!set.has(k))return true;if(k&&!bl.has(k)){S.trash.push(Object.assign({},g,{group_key:k,deleted_at:now(),delete_reason:reason}));bl.add(k);n++}return false});keys.forEach(k=>{SEL.delete(k);CSEL.delete(k)});sv();R.all();toast('Đã chuyển '+n+' nhóm vào “Đã xóa”')},
           delSel(){if(!SEL.size)return alert('Hãy chọn ít nhất một nhóm.');if(confirm('Chuyển '+SEL.size+' nhóm vào tab “Đã xóa”?\n\n• Không hiện lại khi Đồng bộ / Import / Tìm nhóm.\n• Không rời nhóm trên Facebook.\n• Khôi phục được bất cứ lúc nào.'))A.trash([...SEL],'Xóa thủ công')},
           delVisible(){const ks=gRows().map(r=>gk(r[1].url));if(!ks.length)return;if(confirm((ks.length==S.groups.length?'⚠ Bạn đang xóa TOÀN BỘ danh sách nhóm.\n\n':'')+'Chuyển '+ks.length+' nhóm đang lọc vào tab “Đã xóa”?'))A.trash(ks,'Xóa theo bộ lọc')},
           restore(all){const set=new Set(all?S.trash.map(g=>gk(g.url)):[...TSEL]);if(!set.size)return toast('Chưa chọn nhóm');const ex=new Set(S.groups.map(g=>gk(g.url)));S.trash=S.trash.filter(g=>{const k=gk(g.url);if(!set.has(k))return true;if(!ex.has(k)){const r=Object.assign({},g);['group_key','deleted_at','delete_reason'].forEach(f=>delete r[f]);S.groups.push(r)}return false});TSEL.clear();sv();R.all();toast('Đã khôi phục')},
           unblock(){if(!TSEL.size)return toast('Chưa chọn nhóm');if(!confirm('Bỏ chặn '+TSEL.size+' nhóm? Nhóm sẽ biến khỏi thùng rác và có thể xuất hiện lại khi Đồng bộ / Tìm nhóm.'))return;S.trash=S.trash.filter(g=>!TSEL.has(gk(g.url)));TSEL.clear();sv();R.all()},
           fAdd(){const list=FR.filter(g=>FSEL.has(gk(g.url)));if(!list.length)return toast('Chọn ít nhất một nhóm');const ex=new Set(S.groups.map(g=>gk(g.url))),bl=blockedKeys();let add=0,b=0;list.forEach(g=>{const k=gk(g.url);if(bl.has(k)){b++;return}if(!ex.has(k)){S.groups.push(Object.assign({},g));ex.add(k);add++}});sv();R.all();alert('Đã thêm '+add+' nhóm.'+(b?'\nBỏ qua '+b+' nhóm trong tab “Đã xóa”.':''))},
           recentLoad(last){let x;if(last)x=S.last;else{const v=$('#cRecent').value;x=v===''?null:(S.recent||[])[+v]}if(!x)return toast('Chưa có bài nào được lưu');const c=campRead();c.act=x.act;c.url=x.url||'';c.text=x.text||'';c.meth=x.meth||c.meth;campWrite(c);toast('Đã nạp bài đã lưu')},
          campUi(){const sh=$('#cAct').value=='share';$('#cShareBox').style.display=sh?'block':'none';$('#sgPost').classList.toggle('on',!sh);$('#sgShare').classList.toggle('on',sh);R.camp()},
           campPick(){const c=campRead(),tm=todayMap(),pk=postedKeys(c);const rows=S.groups.map(g=>[g,mnum(g)]).sort((a,b)=>b[1]-a[1]||String(a[0].name||'').localeCompare(String(b[0].name||'')));
          shB(`<div style="position:sticky;top:0;z-index:4;background:var(--card);margin:-14px -14px 8px;padding:12px 14px 8px;border-bottom:1px solid var(--line)"><div class="row"><h2 style="margin:0">Chọn nhóm (nhiều TV → ít TV)</h2><b class="fx" id="cpN" style="color:var(--acc)"></b></div><div class="grid3" style="margin-top:8px"><button class="g s" onclick="A.cpAll(1)">Chọn nhóm đạt lọc</button><button class="g s" onclick="A.cpAll(0)">Bỏ chọn hết</button><button class="s" onclick="A.close()">Xong</button></div><button class="g s" style="width:100%;margin-top:6px" onclick="A.cpDone()">Bỏ chọn nhóm đã đăng / đã chia sẻ</button></div><div id="cpL">${rows.map(([g,n],i)=>{const r=campReason(g,c),k=gk(g.url),td=tm[k],ip=pk.has(k);return'<label class="gi '+((td||ip)?'done':r?'uv':'')+'"><input type="checkbox" '+(CSEL.has(k)?'checked':'')+' onchange="A.cp(\''+k.replace(/'/g,'')+'\',this.checked)"><div class="gb"><b>'+(i+1)+'. '+esc(g.name||g.url)+'</b><small>'+(n?n.toLocaleString('vi'):esc(g.members||'—'))+' thành viên • '+esc(g.membership_status||'')+(r?' • loại: '+r:'')+'</small>'+((td||ip)?'<div class="chips">'+(td?chip('✔ HÔM NAY: '+td.t,'ok'):'')+(ip?chip('ĐÃ CHIA SẺ LINK NÀY','ok'):'')+'</div>':'')+'</div></label>'}).join('')}</div>`);A.cpN()},
          cpN(){const e=$('#cpN');if(e)e.textContent='Đã chọn '+CSEL.size},
          cpDone(){const c=campRead(),tm=todayMap(),pk=postedKeys(c);let n=0;[...CSEL].forEach(k=>{if(tm[k]||pk.has(k)){CSEL.delete(k);n++}});const st=$('#shB').scrollTop;A.campPick();$('#shB').scrollTop=st;R.camp();toast('Đã bỏ '+n+' nhóm đã đăng')},
          cp(k,v){v?CSEL.add(k):CSEL.delete(k);R.camp();A.cpN()},cpAll(v){const c=campRead();CSEL.clear();if(v)S.groups.forEach(g=>{if(campReason(g,c)=='')CSEL.add(gk(g.url))});const st=$('#shB').scrollTop;A.campPick();$('#shB').scrollTop=st;R.camp()},
           campSave(upd){let n=S.camp;if(!upd||!n){n=prompt('Tên chiến dịch:');if(!n)return}const c=campRead();c.name=n;const i=S.camps.findIndex(x=>x.name==n);if(i>=0)S.camps[i]=c;else S.camps.push(c);S.camp=n;sv();R.camp();toast('Đã lưu chiến dịch')},
           campLoad(){const n=$('#cLib').value;S.camp=n||null;const c=S.camps.find(x=>x.name==n);if(c)campWrite(c);else R.camp();sv()},
           campDel(){if(!S.camp||!confirm('Xóa chiến dịch “'+S.camp+'”?'))return;S.camps=S.camps.filter(x=>x.name!=S.camp);S.camp=null;sv();R.camp()},
           
           campRun:()=>campRun(),verify:()=>verifyPosts(),engRefresh:()=>engRefresh(),
           exportHist(){const rows=[['Thời gian','Loại','Tài khoản','Mục tiêu','Trạng thái','Chi tiết','Link']].concat(S.hist.map(h=>[h.time,h.kind,h.acc,h.target,h.status,h.detail,h.link]));const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\n');
            if(navigator.share){navigator.share({title:'Lịch sử FABOOK PRO',text:csv}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(csv);toast('Đã copy CSV')}},
           async login(){if(T.busy)return toast('Đang chạy tác vụ khác');if(!Br())return alert('Thiếu plugin trình duyệt.');await Br().openWeb({url:'https://m.facebook.com/login',mode:'mobile',show:true});await Br().setBarTitle({title:'Đăng nhập Facebook — xong sẽ tự đóng'});toast('Đăng nhập trong cửa sổ Facebook');
            const t0=Date.now();let stopReq=false;if(Br().addListener)Br().addListener('stopRequested',()=>stopReq=true);
            while(Date.now()-t0<600000&&!stopReq){await W(2000);const s=await Br().session();if(s.loggedIn){await W(1500);S.acc={ok:true,uid:s.uid,t:Date.now()};sv();await Br().closeWeb();R.acc();tick();toast('Đăng nhập thành công ✓');return}}
            try{await Br().closeWeb()}catch(e){}await A.chk()},
           async chk(){if(!Br())return;const bad=await needLogin();R.acc();tick();toast(bad?'Chưa đăng nhập Facebook':'Đã đăng nhập ✓')},
           async logout(){if(T.busy||!confirm('Xóa phiên đăng nhập Facebook trên app để đăng nhập tài khoản khác?'))return;await Br().clearSession();S.acc={ok:false,uid:''};sv();R.acc();tick();toast('Đã xóa phiên')},
           saveSet(){S.set.bg=$('#sBg').checked;S.set.showFb=$('#sFb').checked;S.set.j1=+$('#sJ1').value||15;S.set.j2=Math.max(+$('#sJ2').value||30,S.set.j1);S.set.theme=$('#sTh').value;theme();sv()},
           backup(){const v=JSON.stringify(S);if(navigator.clipboard){navigator.clipboard.writeText(v);toast('Đã copy bản sao lưu')}else prompt('Sao chép bản sao lưu:',v)},
           restoreBk(){const v=prompt('Dán bản sao lưu JSON:');if(!v)return;try{const d=JSON.parse(v);if(!Array.isArray(d.groups))throw 0;S=Object.assign(S,d);sv();R.all();toast('Đã khôi phục dữ liệu')}catch(e){alert('Dữ liệu không hợp lệ')}},
           act(v){$('#cAct').value=v;A.campUi()},fClr(){FSEL.clear();R.find()},
          retry(){const bad=QUEUE.filter(q=>q.st=='LỖI').map(q=>q.g);if(!bad.length)return toast('Không có nhóm lỗi để chạy lại');CSEL.clear();bad.forEach(k=>CSEL.add(k));$('#cMode').value='Chọn thủ công';R.camp();campRun()},
          close(){$('#sheet').classList.remove('on')}};
          function shB(h){$('#shB').innerHTML=h;$('#sheet').classList.add('on')}
          function theme(){const t=S.set.theme;document.documentElement.dataset.th=t=='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t}
          /* ---------- điều hướng ---------- */
          const ICON={groups:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M9 4v16"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',find:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',camp:'<path d="M4 20l4-1 11-11-3-3L5 16z"/>',hist:'<path d="M3 12a9 9 0 109-9 9 9 0 00-7 3M3 4v5h5M12 8v5l3 2"/>',eng:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>'};
          const TABS=[['groups','Nhóm FB'],['trash','Đã xóa'],['find','Tìm nhóm'],['camp','Đăng bài'],['hist','Lịch sử'],['eng','Tương tác']];
          $('#nav').innerHTML=TABS.map(t=>'<button id="nav-'+t[0]+'" onclick="P(\''+t[0]+'\')"><svg viewBox="0 0 24 24">'+ICON[t[0]]+'</svg><b style="font-weight:600">'+t[1]+'</b></button>').join('');
          function P(k){document.querySelectorAll('.pg').forEach(e=>e.classList.toggle('on',e.id=='pg-'+k));TABS.forEach(t=>$('#nav-'+t[0]).classList.toggle('on',t[0]==k));$('#main').scrollTop=0;(R[k]||R.all)()}
          /* ---------- khởi động ---------- */
          (async function init(){let raw='';try{if(Br()){const r=await Br().load({key:KEY});raw=r&&r.value||''}}catch(e){}if(!raw)try{raw=localStorage.getItem(KEY)||''}catch(e){}
           if(raw)try{const d=JSON.parse(raw);S=Object.assign(S,d);S.set=Object.assign({skipOk:true,bg:true,showFb:false,theme:'auto',j1:15,j2:30,f:'Tất cả',s:'Thành viên ↓'},d.set||{})}catch(e){}
           S.set.s='Thành viên ↓';$('#gF').value=S.set.f;$('#gS').value=S.set.s;$('#gSkip').checked=!!S.set.skipOk;theme();R.all();try{if(S.draft)campWrite(S.draft)}catch(e){}A.campUi();R.recent();P('groups');
           if(Br()&&Br().addListener)Br().addListener('stopRequested',()=>A.stop());
           if(!Br())toast('Chưa tìm thấy plugin trình duyệt');else try{await needLogin();tick();R.acc()}catch(e){}})();
          ['cAct','cUrl','cTx','cMode','cMin','cMax','cRj','cRs','cMeth','cHide','cD1','cD2','cW'].forEach(i=>document.addEventListener('input',e=>{if(e.target.id==i){R.camp();try{S.draft=campRead();sv()}catch(_){}}}));
          </script></body></html>
          AUTU_EOF
          sed -i '' "s/__BUILD__/${GITHUB_RUN_NUMBER}/" www/index.html
          grep -c "Đồng bộ nhóm của tôi" www/index.html
      - run: npm install --install-links
      - run: npx cap add ios
      - name: Cau hinh iOS (HTTP, chay nen, iOS 14)
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" $P
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" $P
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $P
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" $P
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '14.0'/" ios/App/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g" ios/App/App.xcodeproj/project.pbxproj
          grep -n "platform :ios" ios/App/Podfile
      - run: npx cap sync ios
      - name: Kiem tra plugin da dang ky
        run: |
          cat ios/App/App/capacitor.config.json
          grep -q "AutuBrowserPlugin" ios/App/App/capacitor.config.json || (echo "THIEU PLUGIN AutuBrowserPlugin trong packageClassList" && exit 1)
          grep -q "AutuBrowser" ios/App/Podfile || (echo "THIEU pod AutuBrowser trong Podfile" && exit 1)
      - name: Build khong ky
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Dong goi ipa
        run: |
          mkdir -p Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr FABOOK-PRO-build-${{ github.run_number }}.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FABOOK-PRO-ipa-build-${{ github.run_number }}
          path: FABOOK-PRO-build-${{ github.run_number }}.ipa
