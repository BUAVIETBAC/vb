          <div class="grid2"><select id="hKind" onchange="R.hist()"><option>Tất cả</option><option>Tác vụ</option><option>Chiến dịch</option><option>Đăng bài</option><option>Chia sẻ</option></select><input type="search" id="hQ" placeholder="Tìm nhóm, trạng thái..." oninput="R.hist()"></div>
          <div class="grid2" style="margin-top:6px"><button class="g s" onclick="A.verify()">✔ Xác minh bài + lấy link</button><button class="g s" onclick="A.exportHist()">⇩ Xuất CSV</button></div></div><div id="hList"></div></section>

          <section class="pg" id="pg-eng"><div class="card slim"><div class="kpis" id="eK"></div>
          <div class="grid2"><select id="eP" onchange="R.eng()"><option value="7">7 ngày</option><option value="30">30 ngày</option><option value="0">Tất cả</option></select><select id="eS" onchange="R.eng()"><option>Điểm HQ cao</option><option>Tương tác cao</option><option>Mới nhất</option></select></div>
          <button style="width:100%;margin-top:6px" onclick="A.engRefresh()">↻ Cập nhật tương tác</button><small>Đọc từ bài ĐĂNG MỚI (tự lấy link nếu còn thiếu).</small></div><div id="eList"></div></section>

          <section class="pg" id="pg-acc"><div class="card"><h2 id="aT">Chưa kiểm tra đăng nhập</h2><small>Facebook chạy trong trình duyệt riêng của app, giữ phiên đăng nhập (kể cả mã 2 lớp). iPhone dùng 1 tài khoản tại một thời điểm.</small>
          <button style="width:100%;margin-top:8px" onclick="A.login()">🔑 Đăng nhập Facebook</button><div class="grid2" style="margin-top:6px"><button class="g" onclick="A.chk()">✓ Kiểm tra phiên</button><button class="r" onclick="A.logout()">Đổi tài khoản</button></div></div>
