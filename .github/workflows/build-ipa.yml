           return{url:canon(url)||url,name,members:mn>0?members:'Không thấy',members_num:mn,member_count_verified:mn>0,membership_status:joined?'ĐÃ THAM GIA':avail?'CHƯA THAM GIA':'KHÔNG XÁC MINH',membership_verified:!!(joined||avail),scan_status:ok?'OK':'THIẾU DỮ LIỆU',scan_error:ok?'':'Facebook chưa cung cấp đủ tên/số thành viên trong lần đọc này.',scanned_at:now(),enabled:true}}
