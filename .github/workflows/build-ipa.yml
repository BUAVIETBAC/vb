          <section class="pg" id="pg-about">
          <div class="card"><h2 style="margin:0">FACEBOOK AUTUPRO</h2><small>Phiên bản 3.2 • Đăng bài, chia sẻ và quản lý nhóm Facebook tự động</small>
          <div class="card slim" style="margin-top:10px"><b>Tác giả: Hiếu</b><br><span style="font-size:20px;font-weight:800;letter-spacing:.5px">0935 791 000</span>
          <div class="grid3" style="margin-top:8px"><button class="s" onclick="A.ext('tel:0935791000')">📞 Gọi</button><button class="g s" onclick="A.ext('https://zalo.me/0935791000')">💬 Zalo</button><button class="g s" onclick="A.copyTxt('0935791000')">Sao chép</button></div>
          <small>Hỗ trợ cài đặt, báo lỗi và đặt làm thêm tính năng.</small></div></div>
          <div class="card"><h3 style="margin-top:0">Hướng dẫn sử dụng</h3>
          <details open><summary><b>1. Bắt đầu nhanh (5 bước)</b></summary><small>
          ① Bấm nút trạng thái Facebook ở góc trên bên phải → <b>🔑 Đăng nhập Facebook</b> (hỗ trợ mã 2 lớp). App dùng 1 tài khoản tại một thời điểm, muốn đổi bấm “Đổi tài khoản”.<br>
          ② Tab <b>Nhóm FB</b> → <b>↻ Đồng bộ nhóm của tôi</b> để lấy danh sách nhóm đang tham gia, sau đó <b>Quét</b> để lấy số thành viên.<br>
          ③ Tab <b>Đăng bài</b> → chọn <b>✎ Đăng bài mới</b> hoặc <b>↪ Chia sẻ bài</b> → nhập nội dung → chọn nhóm.<br>
          ④ Bấm <b>▶ CHẠY</b>. Mỗi nhóm có thanh tiến trình riêng (đang mở nhóm → đang đăng → đang ẩn link…) kèm % hoàn thành.<br>
          ⑤ Chạy xong app tự <b>kiểm tra lại</b> xem bài có thật sự lên không, rồi xem kết quả ở tab <b>Lịch sử</b>.</small></details>
          <details><summary><b>2. Tab Nhóm FB</b></summary><small>
          • <b>Đồng bộ nhóm của tôi</b>: lấy toàn bộ nhóm bạn đã tham gia.<br>• <b>Quét đã chọn / Quét tất cả</b>: lấy tên, số thành viên, trạng thái tham gia.<br>• <b>+ Thêm nhóm / Import TXT</b>: thêm nhóm bằng link hoặc ID (mỗi dòng một nhóm).<br>• <b>＋ Yêu cầu tham gia</b>: gửi yêu cầu vào các nhóm chưa tham gia (có nghỉ giữa các nhóm).<br>• <b>👤 Tìm admin</b>: lấy tên + trang cá nhân quản trị viên/người kiểm duyệt của nhóm để liên hệ xin đăng bài.<br>• <b>🚫 Kiểm tra bài bị gỡ</b>: phát hiện nhóm admin đã gỡ bài của bạn (hiện chip “BỊ GỠ BÀI” và cảnh báo ở lần đăng sau).<br>• Vuốt dòng nhóm sang trái để xóa vào mục <b>Đã xóa</b> (khôi phục được).</small></details>
          <details><summary><b>3. Tab Tìm nhóm</b></summary><small>Nhập từ khóa (ví dụ “mua bán máy công trình”), đặt số thành viên tối thiểu/tối đa → <b>Tìm</b> → chọn nhóm → <b>Gửi yêu cầu vào</b>.</small></details>
          <details><summary><b>4. Tab Đăng bài — đăng và chia sẻ</b></summary><small>
          • <b>Nội dung</b>: hỗ trợ spin <b>{Xin chào|Chào cả nhà}</b> (mỗi nhóm một biến thể) và nhiều mẫu bài, ngăn cách bằng dòng <b>---</b>.<br>• <b>Chia sẻ bài</b>: dán link bài Facebook → <b>✔ Kiểm tra</b>. Tick “Ẩn link trong bài” để bài chỉ còn khung xem trước, không lộ đường link.<br>• <b>Nhóm đăng</b>: chọn thủ công, hoặc lọc theo thành viên (nhóm đông chạy trước). Tick “Chỉ đăng nhóm đã tham gia” để bỏ qua nhóm chưa vào.<br>• <b>Nhịp chạy</b>: nghỉ giữa các nhóm (mặc định 60–120 giây). Nên để nghỉ lâu để tránh bị Facebook chặn.<br>• <b>⏸ Tạm dừng / ▶ Tiếp tục</b>: app dừng sau khi xong nhóm đang đăng. <b>■ Dừng</b>: kết thúc hẳn.<br>• <b>Hiện FB</b> (trên thanh tác vụ): xem trực tiếp cửa sổ Facebook đang chạy.<br>• <b>↻ Chạy lại nhóm lỗi</b>: chạy lại các nhóm lỗi / không thấy bài.</small></details>
          <details><summary><b>5. Ý nghĩa trạng thái từng nhóm</b></summary><small>
          <b>THÀNH CÔNG</b>: đã xác minh bài có trong nhóm.<br><b>CHỜ DUYỆT</b>: bài đang chờ admin duyệt.<br><b>CHƯA XÁC NHẬN</b>: đã bấm Đăng nhưng chưa thấy bài — app sẽ tự kiểm tra lại.<br><b>KHÔNG THẤY BÀI</b>: báo đã đăng nhưng không có trong “Bài của bạn”, “Chờ duyệt” hay “Bị gỡ” — hãy mở nhóm kiểm tra (có thể chưa tham gia, nhóm chặn đăng hoặc Facebook chặn).<br><b>BỊ GỠ</b>: admin đã gỡ bài.<br><b>LỖI</b>: không đăng được (xem ghi chú dưới tên nhóm). <b>BỎ QUA</b>: nhóm không qua bộ lọc.<br>Nút <b>🔎 Kiểm tra lại bài đã đăng</b> kiểm tra lại các bài trong 24 giờ qua bất cứ lúc nào.</small></details>
          <details><summary><b>6. Lịch sử &amp; Tương tác</b></summary><small>• <b>Lịch sử</b>: mọi lần đăng/chia sẻ, lọc theo ngày và trạng thái, có tỷ lệ thành công; bài thiếu link có thể bấm xác minh để lấy link.<br>• <b>Tương tác</b>: theo dõi cảm xúc, bình luận của các bài đã đăng (cần có link bài).</small></details>
          <details><summary><b>7. Cài đặt &amp; mẹo an toàn</b></summary><small>
          • Vào mục trạng thái Facebook để bật <b>Chạy khi ẩn app / khóa màn hình</b> và <b>Hiện cửa sổ Facebook khi chạy</b>.<br>• Nên đăng 20–40 nhóm mỗi đợt, nghỉ 60–120 giây giữa các nhóm, đổi nội dung giữa các ngày (dùng spin).<br>• Nếu Facebook chặn tính năng, app tự dừng — hãy nghỉ vài giờ rồi chạy lại.<br>• Sao lưu dữ liệu định kỳ ở mục <b>Dữ liệu → Sao lưu</b>.<br>• Đăng nhóm chưa tham gia thường không có ô soạn bài — hãy tham gia/được duyệt vào nhóm trước.</small></details>
          </div></section>
