          /* ---------- Messenger ---------- */
          async function pg_msg_list(A){for(let i=0;i<24&&!document.querySelector('a[href*="/messages/t/"],a[href*="/messages/e2ee/t/"]');i++)await A.sl(500);await A.sl(600);
          const body=(document.body?document.body.innerText:''),has=!!document.querySelector('a[href*="/messages/t/"],a[href*="/messages/e2ee/t/"]');const needPin=!has&&/(nhập mã pin|enter your pin|khôi phục tin nhắn|restore your chats|mã pin)/i.test(body);
          const out=[],seen={};
          for(const a of document.querySelectorAll('a[href*="/messages/t/"],a[href*="/messages/e2ee/t/"]')){if(!A.vis(a))continue;const m=a.href.match(/\/messages\/(e2ee\/)?t\/([^/?#]+)/);if(!m||seen[m[2]])continue;seen[m[2]]=1;
          const lines=(a.innerText||'').split('\n').map(x=>x.trim()).filter(Boolean);const name=lines[0]||'';const rest=lines.slice(1).join(' ');let prev=rest,time='';const i2=rest.lastIndexOf('·');if(i2>0){prev=rest.slice(0,i2).trim();time=rest.slice(i2+1).trim()}
          let unread=/(chưa đọc|unread)/i.test(a.getAttribute('aria-label')||'');
          if(!unread){for(const e of a.querySelectorAll('span,div')){if(e.children.length>0)continue;const tx=(e.innerText||'').trim();if(!tx||tx===name)continue;const w=parseInt(getComputedStyle(e).fontWeight)||400;if(w>=600&&prev&&prev.includes(tx.slice(0,12))){unread=true;break}}}
          if(!unread&&a.querySelector('[aria-label*="chưa đọc"],[aria-label*="Unread"],[aria-label*="Mark as read"],[aria-label*="Đánh dấu là đã đọc"]'))unread=true;
          const img=a.querySelector('img');out.push({id:m[2],e2:!!m[1],name,prev:prev.slice(0,140),time,unread,img:img?img.src:''})}
          return{threads:out.slice(0,60),needPin}}
          async function pg_msg_read(A){const EDS='[contenteditable=true][role=textbox],[role=main] [contenteditable=true]';for(let i=0;i<24&&!document.querySelector(EDS);i++)await A.sl(500);await A.sl(900);
          const body=(document.body?document.body.innerText:'');const ed=[...document.querySelectorAll(EDS)].filter(A.vis).pop();
          if(!ed)return{msgs:[],needPin:/(mã pin|nhập pin|enter your pin|khôi phục tin nhắn|restore your chats)/i.test(body),name:''};
          const main=document.querySelector('[role=main]')||document.body,cr=ed.getBoundingClientRect(),midX=cr.left+cr.width/2,list=[];
          for(const e of main.querySelectorAll('div[dir=auto],span[dir=auto]')){if(!A.vis(e))continue;if(e.closest('[contenteditable=true]'))continue;if(e.querySelector('div[dir=auto],span[dir=auto]'))continue;const tx=(e.innerText||'').trim();if(!tx||tx.length>2000)continue;const r=e.getBoundingClientRect();if(r.width<8||r.height<8)continue;if(r.top>cr.top-2)continue;if(r.left<cr.left-cr.width*0.2||r.left>cr.right+20)continue;
          const cx=r.left+r.width/2;list.push({t:tx,mine:cx>midX,sys:Math.abs(cx-midX)<cr.width*0.1&&tx.length<40,y:Math.round(r.top)})}
          list.sort((a,b)=>a.y-b.y);const out=[];for(const m of list){const l=out[out.length-1];if(l&&l.t===m.t&&l.mine===m.mine&&Math.abs(l.y-m.y)<6)continue;out.push(m)}
          const h=main.querySelector('h1,h2');return{msgs:out.slice(-60).map(m=>({t:m.t,mine:m.mine,sys:m.sys})),needPin:false,name:h?(h.innerText||'').trim():''}}
          async function pg_msg_send(A,o){const EDS='[contenteditable=true][role=textbox],[role=main] [contenteditable=true]';const ed=[...document.querySelectorAll(EDS)].filter(A.vis).pop();if(!ed)return{ok:false,d:'không thấy ô nhập tin (có thể cần nhập mã PIN)'};
          ed.focus();await A.sl(300);const lines=String(o.text||'').split('\n');lines.forEach((l,i)=>{if(i)document.execCommand('insertLineBreak');if(l)document.execCommand('insertText',false,l)});ed.dispatchEvent(new InputEvent('input',{bubbles:true}));await A.sl(500);
          const probe=A.norm(o.text||'').slice(0,12);if(!A.norm(ed.innerText||'').includes(probe))return{ok:false,d:'ô nhập không nhận chữ'};
          const btn=A.find(/^(Gửi|Send|Nhấn Enter để gửi|Press Enter to send)$/i);if(btn){await A.press(btn)}else{for(const n of['keydown','keypress','keyup'])ed.dispatchEvent(new KeyboardEvent(n,{key:'Enter',code:'Enter',keyCode:13,which:13,bubbles:true,cancelable:true}))}
          await A.sl(1600);const left=A.norm(ed.innerText||'').includes(probe);if(left){for(const n of['keydown','keypress','keyup'])ed.dispatchEvent(new KeyboardEvent(n,{key:'Enter',code:'Enter',keyCode:13,which:13,bubbles:true,cancelable:true}));await A.sl(1400)}
          return{ok:!A.norm(ed.innerText||'').includes(probe),d:'đã bấm gửi'}}
          /* --- phía app --- */
          async function msgPrepare(){if(T.busy){toast('Đang chạy tác vụ khác — chờ xong rồi dùng Tin nhắn');return false}if(!Br()){alert('Thiếu plugin trình duyệt AutuBrowser.');return false}
          if(M.ready){try{const s=await Br().state();if(s.alive)return true}catch(e){}M.ready=false}
          if(await needLogin()){toast('Chưa đăng nhập Facebook — vào Tài khoản → Đăng nhập');return false}
          await Br().openWeb({url:'about:blank',mode:'desktop',show:false,light:false});M.ready=true;return true}
          async function msgInbox(silent){if(M.busy||T.busy){if(!silent)toast(T.busy?'Đang chạy tác vụ khác — chờ xong rồi tải lại':'Đang tải…');return}M.busy=true;const st=$('#mSt');if(st&&!silent)st.textContent='Đang tải hộp thư…';
          try{if(!await msgPrepare())return;const s=await Br().state();if(!/facebook\.com\/messages\/?(t\/?)?($|\?)/.test(s.url||'')){await Br().gotoUrl({url:'https://www.facebook.com/messages/t/'});await waitLoad();await W(1500)}
          const r=await run(pg_msg_list,null,45)||{threads:[]},th=r.threads||[];const old={};M.threads.forEach(x=>old[x.id]=x);
          const fresh=th.filter(x=>x.unread&&(!old[x.id]||old[x.id].prev!==x.prev||!old[x.id].unread));
          if(M.inited&&fresh.length){const f=fresh[0];toast('💬 '+f.name+': '+f.prev);try{Br().notify({title:'💬 '+f.name+(fresh.length>1?' (+'+(fresh.length-1)+' tin khác)':''),body:f.prev})}catch(e){}}
          M.threads=th;M.unread=th.filter(x=>x.unread).length;M.t=now();M.needPin=!!r.needPin;M.inited=th.length>0||M.inited}
          catch(e){if(st)st.textContent='Lỗi: '+(e.message||e)}finally{M.busy=false;R.msg()}}
          async function msgThread(id,e2,silent){if(M.busy||T.busy){if(!silent)toast('Đang bận, thử lại sau giây lát');return}M.busy=true;if(!silent){M.loading=true;renderChat()}
          try{if(!await msgPrepare())return;const s=await Br().state();if(!(s.url||'').includes('/t/'+id)){await Br().gotoUrl({url:'https://www.facebook.com/messages/'+(e2?'e2ee/':'')+'t/'+id+'/'});await waitLoad();await W(1800)}
          const r=await run(pg_msg_read,null,45)||{msgs:[]};if(!M.open||M.open.id!==id)return;const before=M.msgs.filter(m=>!m.mine&&!m.sys).slice(-1)[0];M.msgs=r.msgs||[];M.needPin=!!r.needPin;const after=M.msgs.filter(m=>!m.mine&&!m.sys).slice(-1)[0];
          if(silent&&after&&(!before||before.t!==after.t)){toast('💬 '+M.open.name+': '+after.t.slice(0,60));try{Br().notify({title:'💬 '+M.open.name,body:after.t.slice(0,120)})}catch(e){}}}
          catch(e){toast('Lỗi tin nhắn: '+(e.message||e))}finally{M.busy=false;M.loading=false;renderChat(!silent)}}
          async function msgSend(){const ta=$('#mIn'),text=((ta&&ta.value)||'').trim();if(!text||!M.open)return;if(M.busy||T.busy)return toast('Đang bận, thử lại sau giây lát');M.busy=true;const id=M.open.id,e2=M.open.e2;let ok=false;
          try{if(!await msgPrepare())return;const s=await Br().state();if(!(s.url||'').includes('/t/'+id)){await Br().gotoUrl({url:'https://www.facebook.com/messages/'+(e2?'e2ee/':'')+'t/'+id+'/'});await waitLoad();await W(1800)}
          const r=await run(pg_msg_send,{text},45);if(r&&r.ok){ok=true;ta.value='';M.msgs.push({t:text,mine:true});renderChat()}else toast('Không gửi được: '+((r&&r.d)||'lỗi không rõ'))}
          catch(e){toast('Lỗi gửi: '+(e.message||e))}finally{M.busy=false}if(ok){await W(1200);msgThread(id,e2,true)}}
          function msgPoll(){if(!M.auto||T.busy||M.busy)return;if(M.open)msgThread(M.open.id,M.open.e2,true);else msgInbox(true)}
          function quickHtml(){return(S.set.quick||QUICK).map((q,i)=>'<button class="g s qk" onclick="A.msgQ('+i+')">'+esc(q.length>26?q.slice(0,26)+'…':q)+'</button>').join('')+'<button class="g s qk" onclick="A.msgQadd()">＋</button>'}
          function chatShell(name){return'<div style="position:sticky;top:0;z-index:4;background:var(--card);margin:-14px -14px 6px;padding:10px 14px;border-bottom:1px solid var(--line)"><div class="row"><b style="font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">💬 '+esc(name)+'</b><button class="g s fx" onclick="A.msgRef()">↻</button><button class="g s fx" onclick="A.msgFb()">Hiện FB</button><button class="g s fx" onclick="A.close()">Đóng</button></div><small id="mNote"></small></div><div id="mChat" class="mchat"></div><div class="mbar"><div id="mQk" class="mqk">'+quickHtml()+'</div><div class="row"><textarea id="mIn" rows="2" placeholder="Nhập tin nhắn trả lời…"></textarea><button class="fx" onclick="A.msgSend()">Gửi ➤</button></div></div>'}
          function renderChat(scroll){const el=$('#mChat');if(!el)return;const near=el.scrollHeight-el.scrollTop-el.clientHeight<90;el.innerHTML=M.msgs.length?M.msgs.map(m=>m.sys?'<div class="msys">'+esc(m.t)+'</div>':'<div class="bub '+(m.mine?'me':'th')+'"><span>'+esc(m.t)+'</span></div>').join(''):'<div class="msys">'+(M.loading?'Đang tải cuộc trò chuyện…':'Chưa đọc được tin nhắn — bấm ↻')+'</div>';const n=$('#mNote');if(n)n.textContent=M.needPin?'⚠ Messenger yêu cầu mã PIN — bấm “Hiện FB” để nhập 1 lần rồi bấm ↻':'';if(scroll!==false||near)el.scrollTop=el.scrollHeight}
          /* ---------- khởi động ---------- */
          (async function init(){let raw='';try{if(Br()){const r=await Br().load({key:KEY});raw=r&&r.value||''}}catch(e){}if(!raw)try{raw=localStorage.getItem(KEY)||''}catch(e){}
           if(raw)try{const d=JSON.parse(raw);S=Object.assign(S,d);S.set=Object.assign({skipOk:true,bg:true,showFb:false,theme:'auto',j1:15,j2:30,f:'Tất cả',s:'Thành viên ↓'},d.set||{})}catch(e){}
           if(!S.mig3){S.groups.forEach(g=>{if(g.membership_status=='ĐÃ THAM GIA'){if(g.sync_source=='NHÓM CỦA BẠN'){g.join_evidence=g.join_evidence||'danh sách nhóm của bạn'}else{g.membership_status='KHÔNG XÁC MINH';g.membership_verified=false;g.sync_verified=false;g.join_evidence=''}}});S.mig3=1;sv()}
           S.set.s='Thành viên ↓';$('#gF').value=S.set.f;$('#gS').value=S.set.s;$('#gSkip').checked=!!S.set.skipOk;$('#cLite').checked=S.set.light!==false;theme();R.all();dateStrip();try{if(S.draft)campWrite(S.draft)}catch(e){}A.campUi();R.recent();P('groups');
           if(Br()&&Br().addListener)Br().addListener('stopRequested',()=>A.stop());
          S.set.msgAuto=false;clearInterval(M.timer);
           if(!Br())toast('Chưa tìm thấy plugin trình duyệt');else try{await needLogin();tick();R.acc()}catch(e){}})();
          document.addEventListener('input',e=>{if(e.target.id=='cTx'){const n=$('#cLen');if(n)n.textContent=e.target.value.length+' ký tự'}});
          ['cAct','cUrl','cTx','cMode','cMin','cMax','cRj','cRs','cMeth','cHide','cD1','cD2','cW'].forEach(i=>document.addEventListener('input',e=>{if(e.target.id==i){R.camp();try{S.draft=campRead();sv()}catch(_){}}}));
          (()=>{let sx=0,sy=0,sw=null;const L=document.getElementById('gList');if(!L)return;
          L.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;sw=e.target.closest('.sw')},{passive:true});
          L.addEventListener('touchend',e=>{if(!sw)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0){document.querySelectorAll('#gList .sw.open').forEach(x=>{if(x!==sw)x.classList.remove('open','ask')});sw.classList.add('open')}else sw.classList.remove('open','ask')}sw=null},{passive:true})})();
          </script></body></html>
          AUTU_EOF
          sed -i '' "s/__BUILD__/${GITHUB_RUN_NUMBER}/" www/index.html
          grep -c "Đồng bộ nhóm của tôi" www/index.html
      - run: npm install --install-links
      - run: npx cap add ios
      - name: Cau hinh iOS (HTTP, chay nen, iOS 14)
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" $P
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" $P
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $P
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" $P
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '14.0'/" ios/App/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g" ios/App/App.xcodeproj/project.pbxproj
          grep -n "platform :ios" ios/App/Podfile
      - run: npx cap sync ios
      - name: Kiem tra plugin da dang ky
        run: |
          cat ios/App/App/capacitor.config.json
          grep -q "AutuBrowserPlugin" ios/App/App/capacitor.config.json || (echo "THIEU PLUGIN AutuBrowserPlugin trong packageClassList" && exit 1)
          grep -q "AutuBrowser" ios/App/Podfile || (echo "THIEU pod AutuBrowser trong Podfile" && exit 1)
      - name: Build khong ky
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Dong goi ipa
        run: |
          mkdir -p Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr FACEBOOK-AUTU-build-${{ github.run_number }}.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FACEBOOK-AUTU-ipa-build-${{ github.run_number }}
          path: FACEBOOK-AUTU-build-${{ github.run_number }}.ipa
