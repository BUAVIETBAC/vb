          <small>Giao diện</small><select id="sTh" onchange="A.saveSet()"><option value="auto">Tự động</option><option value="light">Sáng</option><option value="dark">Tối</option></select></div>
          <div class="card"><h3>Dữ liệu</h3><div class="grid2"><button class="g" onclick="A.backup()">Sao lưu (copy)</button><button class="g" onclick="A.restoreBk()">Khôi phục</button></div><small id="aV"></small></div>
