          <div class="grid3" style="margin-top:6px"><div><small>Nghỉ min (s)</small><input type="number" id="cD1" value="60"></div><div><small>Nghỉ max (s)</small><input type="number" id="cD2" value="120"></div><div><small>Chờ đăng (s)</small><input type="number" id="cW" value="6"></div></div></details>
          <div class="card slim"><div class="row"><h3 style="margin:0">Hàng đợi</h3><button class="g s fx" onclick="A.retry()">↻ Chạy lại nhóm lỗi</button></div><div id="cQ"><small>Chưa có hàng đợi.</small></div></div>
          <div class="stick"><button onclick="A.campRun()">▶ Chạy</button></div></section>

