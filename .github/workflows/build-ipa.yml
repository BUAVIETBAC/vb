          function dock(k){const d=$('#dock');if(!d)return;const H={groups:'<small id="gSelN" style="display:block;text-align:center;margin-bottom:4px"></small><div class="grid2"><button class="g s" onclick="A.selAll(1)">Chọn đang lọc</button><button class="g s" onclick="A.selAll(0)">Bỏ chọn</button><button class="s" onclick="A.joinSel()">＋ Yêu cầu tham gia</button><button class="r s" onclick="A.delSel()">Xóa đã chọn</button></div>',find:'<small id="fSelN" style="display:block;text-align:center;margin-bottom:4px"></small><div class="grid3"><button class="g s" onclick="A.fSel()">Chọn tất cả</button><button class="g s" onclick="A.fClr()">Bỏ chọn</button><button class="s" onclick="A.fJoin()">Gửi yêu cầu vào</button></div>',camp:'<button class="run" onclick="A.campRun()">▶ CHẠY <span id="cRunN"></span></button>'}[k];d.innerHTML=H||'';d.classList.toggle('on',!!H);if(k=='groups'){const e=$('#gSelN');if(e)e.textContent='Đã chọn '+SEL.size+' / '+gRows().length+' nhóm đang hiện'}if(k=='camp'){const e=$('#cRunN');if(e){const n=campGroups(campRead()).length;e.textContent=n?'• '+n+' nhóm':''}}if(k=='find'){const e=$('#fSelN');if(e)e.textContent='Đã chọn '+FSEL.size+' / '+FR.length+' nhóm'}}
