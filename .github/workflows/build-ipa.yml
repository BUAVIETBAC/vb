           if(["this content isn't available","nội dung này hiện không xem được","nội dung này không khả dụng"].some(x=>bl.includes(x)))throw new Error('Facebook báo nhóm hiện không khả dụng với tài khoản này.');
           let name=vname(d.og)||vname(d.tw);if(!name)for(const t of d.h1s||[]){name=vname(t);if(name)break}if(!name)name=vname(d.title);name=name||'Không xác định';
