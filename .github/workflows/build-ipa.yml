          <label class="k"><input type="checkbox" id="cRj" checked> Chỉ nhóm đã xác minh tham gia</label><label class="k"><input type="checkbox" id="cRs"> Chỉ nhóm đã quét OK</label><small id="cDiag"></small></div>
